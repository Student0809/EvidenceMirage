extends: configs/experiment.yaml
backend: agentdojo
split: benchmark
evaluation_scope: piminer_agentdojo_test
dataset: data/agentdojo_a2v2_test30_20261030/cases.jsonl
goal_specs: data/agentdojo_a2v2_test30_20261030/goal_specs.jsonl
benchmark_audit: data/agentdojo_a2v2_test30_20261030/coverage.json
require_observable_trigger: false
seed: 20261030
post_failure_target_budget: 4
policies:
  stage_aware:
    max_retries_per_payload: 2
    unknown_action: revise
attacker:
  mode: piminer_aligned
  model: deepseek-flash[1m]
  effort: max
  timeout: 900
  initialization_manifest: data/piminer_aligned30_20261030/initializations.json
  revision_profile: original
  a2_library: strategy_library_a2/library.json
  a2_retrieval: data/a2/test30_20261030.field_v2.retrieval.json
  false_revision_mode: grounded
experiment:
  purpose: 'A2 v2 mixed revision: Trigger=U uses original PIMiner black-box feedback;
    Trigger=F uses the existing Evidence-aware grounded black-box Planner/Generator/Checker;
    Trigger=T retries exact payload under its cap'
  source_test: ../PIMiner/experiments/deepseek_claude_agentdojo_nano.yaml
  source_samples: ../PIMiner/eval_results/pim_test/deepseek_claude_agentdojo_nano_20261023/iterative_attack_01_agentdojo_gpt-5-nano/samples
  source_test_cases: 30
  source_sample_offset: 20
  independent_heldout: false
  learned_controller_enabled: false
  fresh_initial: true
  reused_initial: false
  reused_route: true
  reused_payload: true
  initial_execution_note: Re-execute imported P0 in a fresh Target environment; never
    reuse historical H1
  conversation_continuity: persistent_per_case_and_policy
  rolling_experience: Completed current-run cases share policy-scoped rolling experience;
    sessions and execution histories remain per-case
  reuse_previous_payloads: true
  reuse_previous_routes: true
  total_target_budget_per_case: 5
  case_parallelism: 16
  primary_retry_reason: preserve_observed_trigger
  unknown_retry_reporting: No Unknown exact-payload Retry; report unknown_piminer_revise
    separately from preserve_observed_trigger
  online_evaluation_status: not_run
  retrieval_variant: field_embedding
  cold_start_policy: preserve_bundle_verified_template_without_retrieval_hits
  selection_basis: Same fixed original 30-case test population and P0 bundle as the
    previous run; a new controller configuration, not a replay of its outcomes
  observable_trigger_cases: 22
  unobservable_trigger_cases: 8
  unobservable_trigger_policy: All U failures invoke the original PIMiner-aligned
    black-box revision path without extra execution Evidence
  generator_routing:
    unknown: piminer_black_box
    'false': grounded_evidence_black_box
    'true': exact_payload_retry_until_cap_then_piminer_black_box
  evidence_visibility: F planner/generator only; never put Evidence packets, plans
    or F analysis into the U persistent session or rolling experience
  comparison_note: Same original 30 cases, P0, A2 v2 resources and five-trajectory
    budget as the previous run; new H1 and stochastic generation/rolling-memory order
    prevent a strict causal estimate
allow_unobservable_trigger: true
