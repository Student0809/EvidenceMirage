extends: configs/experiment.yaml
backend: agentdojo
split: benchmark
evaluation_scope: piminer_agentdojo_test
dataset: data/agentdojo_a2v2_test30_20261030/cases.jsonl
goal_specs: data/agentdojo_a2v2_test30_20261030/goal_specs.jsonl
benchmark_audit: data/agentdojo_a2v2_test30_20261030/coverage.json
require_observable_trigger: false
seed: 20261030
post_failure_target_budget: 4
policies:
  stage_aware:
    max_retries_per_payload: 2
    unknown_action: revise
attacker:
  mode: piminer_aligned
  model: deepseek-flash[1m]
  effort: max
  timeout: 900
  initialization_manifest: data/piminer_terminal30_20261031/initializations.json
  revision_profile: original
  a2_library: strategy_library_a2/library.json
  a2_retrieval: data/a2/test30_20261030.field_v2.retrieval.json
  false_revision_mode: grounded
experiment:
  purpose: Run the same 30 tasks from the last actually evaluated original PIMiner payload, retaining
    historical success and failure cases, then apply the existing A2 v2 mixed F/U/T policy
  source_test: ../PIMiner/experiments/deepseek_claude_agentdojo_nano.yaml
  source_samples: ../PIMiner/eval_results/pim_test/deepseek_claude_agentdojo_nano_20261023/iterative_attack_01_agentdojo_gpt-5-nano/samples
  source_test_cases: 30
  source_sample_offset: 20
  independent_heldout: false
  learned_controller_enabled: false
  fresh_initial: true
  reused_initial: false
  reused_route: true
  reused_payload: true
  initial_execution_note: Freshly execute the original PIMiner last evaluated payload. P0 is this new
    run initial slot; historical Gold, execution feedback and terminal analysis are excluded.
  conversation_continuity: persistent_per_case_and_policy
  rolling_experience: Completed current-run cases share policy-scoped rolling experience; sessions and
    execution histories remain per-case
  reuse_previous_payloads: true
  reuse_previous_routes: true
  total_target_budget_per_case: 5
  case_parallelism: 8
  primary_retry_reason: preserve_observed_trigger
  unknown_retry_reporting: No Unknown exact-payload Retry; report unknown_piminer_revise separately from
    preserve_observed_trigger
  online_evaluation_status: not_run
  retrieval_variant: field_embedding
  cold_start_policy: preserve_bundle_verified_template_without_retrieval_hits
  selection_basis: Same original 30 cases; replace original P0 with each original terminal executed payload,
    preserving the ordered route and A2 v2 resources
  observable_trigger_cases: 22
  unobservable_trigger_cases: 8
  unobservable_trigger_policy: All U failures invoke the original PIMiner-aligned black-box revision path
    without extra execution Evidence
  generator_routing:
    unknown: piminer_black_box
    'false': grounded_evidence_black_box
    'true': exact_payload_retry_until_cap_then_piminer_black_box
  evidence_visibility: F planner/generator only; never put Evidence packets, plans or F analysis into
    the U persistent session or rolling experience
  comparison_note: A new continuation from historical terminal payloads with at most five additional Target
    executions per task; not an equal-budget original ASR@5 comparison. Eight rather than sixteen workers
    changes rolling-memory order; no fixed-H1 or causal payload-only claim.
  initial_payload_source: piminer_last_evaluated_attempt
  initial_analysis_policy: empty_exclude_historical_revision_reasoning
  initial_payload_provenance: data/piminer_terminal30_20261031/reference.json
  initial_payload_provenance_sha256: ed10dcae96ddb308a6d8e0515675f2ecc39690229a36a36c3159a2a28a5aa091
  source_payload_selection: history[-1] for every original task; no filtering or best-attempt selection
  source_status_counts:
    hit: 14
    miss: 16
  source_terminal_iter_counts:
    '0': 8
    '1': 1
    '2': 3
    '4': 18
  source_terminal_payloads_changed_from_original_p0: 22
  source_feedback_imported: false
  source_terminal_analysis_imported: false
  extra_budget_after_historical_source: true
  parallelism_note: Use eight case workers to reduce request pressure after the preceding run experienced
    provider HTTP503 overloads; this is not a guarantee against external service errors.
allow_unobservable_trigger: true
